["vivaldi-ffmpeg:ffmpeg"]
# Follow the maintained 8.1 series, not the system FFmpeg ABI.
source = "regex"
url = "https://ffmpeg.org/releases/"
regex = 'href="ffmpeg-(8\.1\.[0-9]+)\.tar\.xz"'
sort_version_key = "parse_version"

["vivaldi-ffmpeg:chromium"]
source = "archpkg"
archpkg = "vivaldi-ffmpeg-codecs"
strip_release = true

# Track the actual browser version for the codec installation filename.
["vivaldi-ffmpeg:vivaldi"]
source = "archpkg"
archpkg = "vivaldi"
strip_release = true
from_pattern = '^([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+$'
to_pattern = '\1'

# The packaged codec's filename confirms which Vivaldi series it targets.
# Never infer the codec series from the browser release alone.
["vivaldi-ffmpeg:codec-series"]
source = "regex"
url = "https://archlinux.org/packages/extra/x86_64/vivaldi-ffmpeg-codecs/files/"
regex = 'opt/vivaldi/libffmpeg\.so\.([0-9]+\.[0-9]+)(?=[<\s]|$)'

[vivaldi-ffmpeg]
source = "combiner"
from = ["vivaldi-ffmpeg:ffmpeg", "vivaldi-ffmpeg:chromium", "vivaldi-ffmpeg:vivaldi"]
format = "$1_$2_$3"
