["chromium-ffmpeg:ffmpeg"]
# Follow the maintained 8.1 series, not the system FFmpeg ABI.
source = "regex"
url = "https://ffmpeg.org/releases/"
regex = 'href="ffmpeg-(8\.1\.[0-9]+)\.tar\.xz"'
sort_version_key = "parse_version"

["chromium-ffmpeg:chromium"]
source = "archpkg"
archpkg = "chromium"
strip_release = true

[chromium-ffmpeg]
source = "combiner"
from = ["chromium-ffmpeg:ffmpeg", "chromium-ffmpeg:chromium"]
format = "$1_$2"
