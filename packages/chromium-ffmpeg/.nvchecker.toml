["chromium-ffmpeg:ffmpeg"]
source = "archpkg"
archpkg = "ffmpeg"
strip_release = true
from_pattern = '^[0-9]+:'
to_pattern = ""

["chromium-ffmpeg:chromium"]
source = "archpkg"
archpkg = "chromium"
strip_release = true

[chromium-ffmpeg]
source = "combiner"
from = ["chromium-ffmpeg:ffmpeg", "chromium-ffmpeg:chromium"]
format = "$1_$2"
