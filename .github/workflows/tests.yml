name: Bats tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Shared workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Check Bash helper and task syntax
        run: |
          set -o pipefail
          bash -n tests/check-srcinfo.sh tests/bats/test_helper/common.bash
          find .mise/lib .mise/tasks -type f -print0 | xargs -0 -r -n1 bash -n
      - name: Verify local package source checksums
        run: python3 tests/check-local-source-checksums.py
      - name: Unit tests
        run: mise run test:unit
      - name: Shared workflow integration tests (mocked external tools)
        run: mise run test:integration

  package-tests:
    name: Package-specific Bats suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Package-specific integration tests
        run: mise run test:packages
