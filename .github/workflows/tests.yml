name: Bats tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Check Bash helper syntax
        run: bash -n tests/check-srcinfo.sh tests/bats/test_helper/common.bash
      - name: Unit tests
        run: mise run test:unit
      - name: Workflow integration tests (mocked external tools)
        run: mise run test:integration
