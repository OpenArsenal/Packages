name: Bats tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Shared workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Check Bash helper and task syntax
        run: |
          set -o pipefail
          bash -n tests/check-srcinfo.sh tests/bats/test_helper/common.bash
          find .mise/lib .mise/tasks -type f -print0 | xargs -0 -r -n1 bash -n
      - name: Verify local package source checksums
        run: python3 tests/check-local-source-checksums.py
      - name: Unit tests
        run: mise run test:unit
      - name: Shared workflow integration tests (mocked external tools)
        run: mise run test:integration

  package-tests:
    name: Package-specific Bats suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Package-directory Bats tests
        run: |
          set -euo pipefail
          for package in \
            1password-cli-bin 1password-wayland \
            chromium-ffmpeg vivaldi-ffmpeg \
            electron40-castlab-bin electron41-castlab-bin \
            figma-linux figma-linux-git flutter \
            google-chrome-canary-ffmpeg google-chrome-ffmpeg \
            microsoft-edge-stable-bin visual-studio-code; do
            echo "::group::packages/$package"
            (cd "packages/$package" && mise run test)
            echo "::endgroup::"
          done
