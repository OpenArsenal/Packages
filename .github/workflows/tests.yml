name: Bats tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Shared workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Check Bash helper and task syntax
        run: |
          set -o pipefail
          bash -n tests/check-srcinfo.sh tests/bats/test_helper/common.bash
          find .mise/lib .mise/tasks -type f -print0 | xargs -0 -r -n1 bash -n
      - name: Root shared tests (unit + integration)
        run: mise run test

  package-tests:
    name: Package contracts and regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned bats-core with mise
        uses: jdx/mise-action@v5
      - name: Run package-root test entrypoint (contracts + regressions)
        working-directory: packages
        run: mise run test
