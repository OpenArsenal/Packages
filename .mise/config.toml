[env]
_.file = [".env.repo"]

PKGBUILDS_ROOT = "{{ config_root }}"
PACKAGES_DIR = "{{ get_env(name='PACKAGES_DIR', default=env.PKGBUILDS_ROOT ~ '/packages') }}"
PACKAGES_FILE = "{{ get_env(name='PACKAGES_FILE', default=env.PKGBUILDS_ROOT ~ '/.packages') }}"

REPO_NAME = "{{ get_env(name='REPO_NAME', default='openarsenal') }}"
REPO_ARCH = "{{ get_env(name='REPO_ARCH', default='x86_64_v3') }}"
REPO_BASE = "{{ get_env(name='REPO_BASE', default=env.PKGBUILDS_ROOT ~ '/repo') }}"
REPO_DIR = "{{ get_env(name='REPO_DIR', default=env.REPO_BASE ~ '/' ~ env.REPO_ARCH) }}"
REPO_DB = "{{ get_env(name='REPO_DB', default=env.REPO_DIR ~ '/' ~ env.REPO_NAME ~ '.db.tar.zst') }}"
REPO_SIG_LEVEL = "{{ get_env(name='REPO_SIG_LEVEL', default='Optional TrustAll') }}"
PKGDEST = "{{ get_env(name='PKGDEST', default=env.REPO_DIR) }}"


CHROOT_NAME = "{{ get_env(name='CHROOT_NAME', default=env.REPO_NAME ~ '-' ~ env.REPO_ARCH) }}"
CHROOT_BASE = "{{ get_env(name='CHROOT_BASE', default='/var/lib/archbuild') }}"
CHROOT_DIR = "{{ get_env(name='CHROOT_DIR', default=env.CHROOT_BASE ~ '/' ~ env.CHROOT_NAME) }}"
CHROOT_PACMAN_CONF = "{{ get_env(name='CHROOT_PACMAN_CONF', default='') }}"

SCRIPTS = "{{ env.PKGBUILDS_ROOT }}/scripts"
FEEDS_JSON = "{{ env.PKGBUILDS_ROOT }}/feeds.json"
AURDEST = "{{ env.PKGBUILDS_ROOT }}"

PACKAGER = "{{ get_env(name='PACKAGER', default='OpenArsenal Contributors <cachyos(at)openarsenal(dot)com>') }}"
SOURCE_DATE_EPOCH = "{{ exec(command='git log -1 --format=%ct 2>/dev/null || date -u +%s') | trim }}"

[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks."repo:maintain"]
description = "Update the repository database, then prune old package archives"
depends = ["repo:update"]
depends_post = ["repo:prune"]

[tasks."pkg:import"]
alias = "import"
description = "Import a package from AUR or Arch packaging"
run = 'bash "{{ env.SCRIPTS }}/aur-imports.sh"'
