[tools]
bats = "1.14.0"
shellcheck = "0.11.0"

[env]
_.file = ".env"

PKGBUILDS_ROOT = "{{ config_root }}"
BATS_LIB_PATH = "{{ config_root }}/.mise/vendor/bats"
PACKAGES_DIR = "{{ get_env(name='PACKAGES_DIR', default=env.PKGBUILDS_ROOT ~ '/packages') }}"
PACKAGES_FILE = "{{ get_env(name='PACKAGES_FILE', default=env.PKGBUILDS_ROOT ~ '/.packages') }}"

REPO_NAME = "{{ get_env(name='REPO_NAME', default='openarsenal') }}"
REPO_BASE = "{{ get_env(name='REPO_BASE', default='/srv/pacman/repos/openarsenal') }}"
REPO_ARCH = "{{ get_env(name='REPO_ARCH', default='x86_64_v3') }}"
REPO_DIR = "{{ get_env(name='REPO_DIR', default=env.REPO_BASE ~ '/' ~ env.REPO_ARCH) }}"
REPO_DB = "{{ get_env(name='REPO_DB', default=env.REPO_DIR ~ '/' ~ env.REPO_NAME ~ '.db.tar.zst') }}"
REPO_SIG_LEVEL = "{{ get_env(name='REPO_SIG_LEVEL', default='Optional TrustAll') }}"
PKGDEST = "{{ get_env(name='PKGDEST', default=env.REPO_DIR) }}"

CHROOT_NAME = "{{ get_env(name='CHROOT_NAME', default=env.REPO_NAME ~ '-' ~ env.REPO_ARCH) }}"
CHROOT_BASE = "{{ get_env(name='CHROOT_BASE', default='/var/lib/archbuild') }}"
CHROOT_DIR = "{{ get_env(name='CHROOT_DIR', default=env.CHROOT_BASE ~ '/' ~ env.CHROOT_NAME) }}"
CHROOT_PACMAN_CONF = "{{ get_env(name='CHROOT_PACMAN_CONF', default='') }}"

PACKAGER = "{{ get_env(name='PACKAGER', default='OpenArsenal Contributors <arch-packaging-team(at)openarsenal(dot)com>') }}"
SOURCE_DATE_EPOCH = "{{ exec(command='git log -1 --format=%ct 2>/dev/null || date -u +%s') | trim }}"

[hooks]
# Install the Bash-only Bats helper libraries after mise installs executable tools.
postinstall = "bash .mise/lib/install-bats-libs.sh"

[tasks."test:install-libs"]
description = "Install pinned Bats helper libraries into the ignored mise vendor directory"
run = "bash .mise/lib/install-bats-libs.sh"

[tasks."lint:shell"]
description = "Run ShellCheck on packaging Bash helpers and mise task scripts (opt-in)"
run = "find .mise/lib .mise/tasks -type f -print0 | xargs -0 -r shellcheck -s bash -S warning"

[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks.test]
description = "Run shared Bats unit and packaging workflow tests (no package-specific suites)"
run = "bats tests/bats"

[tasks."test:unit"]
description = "Run isolated shared dependency logic tests"
run = "bats tests/bats/unit.bats"

[tasks."test:integration"]
description = "Run shared packaging workflow integration tests with mocked external tools"
run = "bats tests/bats/build-planning.bats tests/bats/chroot-config.bats tests/bats/file-scans.bats tests/bats/package-metadata.bats tests/bats/package-selection.bats tests/bats/repo-maintenance.bats tests/bats/safe-operations.bats tests/bats/source-integrity.bats"

[tasks."test:all"]
description = "Run the root shared suite and then the package-root test suite"
run = ["mise run test", "cd packages && mise run test"]

[tasks."repo:maintain"]
description = "Update, reconcile, prune, and refresh the published repository"
run = [
  "mise run repo:update",
  "mise run repo:clean",
  "mise run repo:prune",
  "mise run repo:refresh-sync",
]
